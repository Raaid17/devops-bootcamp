<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Card - DevOps Bootcamp 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 1.5rem;
      padding: 3rem;
      width: 360px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeIn 0.8s ease-out;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 35px 60px -15px rgba(99, 102, 241, 0.3);
    }

    .avatar {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .cohort {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      animation: pulse 2s ease-in-out infinite;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.4), transparent);
      margin: 1.5rem 0;
    }

    .footer {
      color: #64748b;
      font-size: 0.75rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🚀</div>
    <h1 class="name">&lt;nama anda&gt;</h1>
    <p class="cohort">Cohort 2026</p>
    <div class="divider"></div>
    <span class="badge">DevOps Engineer</span>
    <div class="divider"></div>
    <p class="footer">DevOps Bootcamp 2026</p>
  </div>
</body>
</html>
